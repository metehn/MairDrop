spring.application.name=mairdrop

# Server ayarlar?
server.port=8080
server.address=0.0.0.0

spring.servlet.multipart.enabled=true
spring.servlet.multipart.location=/tmp
spring.servlet.multipart.file-size-threshold=10MB

# WebSocket settings
# Message size / send limits for the STOMP transport are configured in WebSocketConfig
# (configureWebSocketTransport -> SubProtocolWebSocketHandler): text messages capped at 1 MB so the
# multi-file signalling payloads (file-name/hash arrays) still fit, send buffer at 512 KB and a 10 s
# send time limit so one slow client cannot pin unbounded buffering on the server.

# Tomcat settings
server.tomcat.max-swallow-size=10MB
server.tomcat.connection-timeout=600000

# Reverse proxies allowed to set X-Forwarded-For (comma-separated IPs). Empty = the header is never
# trusted, so a client cannot spoof it to rotate rate-limit keys or enter the LOCAL_NETWORK group.
# Configure the direct peer address (e.g. a Docker bridge like 172.17.0.1) when a proxy sits in front.
mairdrop.trusted-proxy-ips=

# Cap on concurrently live rooms so a client cannot pin hundreds of rooms open (each held by its
# 15-minute close grace) and flood every peer with broadcasts.
mairdrop.max-rooms=200

# WebRTC ICE servers (TURN optional - leave blank to keep STUN-only behavior)
webrtc.turn.url=
webrtc.turn.username=
webrtc.turn.credential=
